apiVersion: 1

providers:
  - name: 'FIBRE Dashboards'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # ../../dashboards in the repository, mounted by docker-compose.yml.
      path: /etc/grafana/dashboards
