apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # The exporters' scrape interval (see prometheus.yml). Grafana sizes the
      # window of a rate from it, so a per-block chart draws each block once.
      timeInterval: "10s"
    uid: prometheus
    orgId: 1