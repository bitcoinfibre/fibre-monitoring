# Set up like the Nix collector's Prometheus (nix/collector.nix); `nix flake
# check` fails if the two drift apart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ../../alerts, mounted by docker-compose.yml. With no Alertmanager the
# rules are still evaluated and shown in Prometheus and Grafana, but nobody
# is notified; add one under `alerting:` to send them somewhere.
rule_files:
  - /etc/prometheus/rules/fibre.rules.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The FIBRE exporters, over HTTPS with basic auth. Each exporter's
  # certificate must hold the address it is scraped at (generate-certs.sh).
  - job_name: 'fibre'
    scrape_interval: 10s
    scheme: https
    tls_config:
      ca_file: /run/secrets/exporter_ca
    basic_auth:
      username: 'prometheus'
      password_file: /run/secrets/exporter_password
    # The nodes are listed in targets/*.yml (see targets/nodes.yml.example),
    # which git ignores, so no node's address ends up in the repository.
    # Prometheus rereads them when they change.
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
